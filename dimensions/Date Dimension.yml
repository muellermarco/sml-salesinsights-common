level_attributes:
  - unique_name: customday
    label: Custom Day
    description: >-
      A 445 calendar with custom parallel period keys defined for each level. 
      The underlying data matches the results of the Retail445 hierarchy because
      the data table contains the standard key assignments generated by the
      default ParallelPeriod logic.  A real custom ParallelPeriod hierarchy
      would have different parallel period key assignments to satisfy the rpt
      business's rpt comparison requirements.
    allowed_calcs_for_dma:
      - Lag
      - ParallelPeriod
      - Ancestor
      - Descendants
      - Siblings
      - PeriodsToDate
      - DatesPeriodsToDate
      - Range
    dataset: datecustom
    is_unique_key: true
    key_columns:
      - datekey
    name_column: rpt_day
    sort_column: datekey
    time_unit: day
  - unique_name: custommonth
    label: Custom Month
    description: Same as [Retail445].[rpt Month] but has a custom parallel period key.
    allowed_calcs_for_dma:
      - Lag
      - ParallelPeriod
      - Ancestor
      - Descendants
      - Siblings
      - PeriodsToDate
      - DatesPeriodsToDate
      - Range
    dataset: datecustom
    key_columns:
      - rpt_month
    name_column: rpt_month_name2
    sort_column: rpt_month
    time_unit: month
  - unique_name: customquarter
    label: Custom Quarter
    description: Same as [Retail445].[rpt Quarter] but has a custom parallel period key.
    allowed_calcs_for_dma:
      - Lag
      - ParallelPeriod
      - Ancestor
      - Descendants
      - Siblings
      - PeriodsToDate
      - DatesPeriodsToDate
      - Range
    dataset: datecustom
    key_columns:
      - rpt_quarter
    name_column: rpt_quarter_name
    sort_column: rpt_quarter
    time_unit: quarter
  - unique_name: customweek
    label: Custom Week
    description: Same as [Retail445].[rpt Week] but has a custom parallel period key.
    allowed_calcs_for_dma:
      - Lag
      - ParallelPeriod
      - Ancestor
      - Descendants
      - Siblings
      - PeriodsToDate
      - DatesPeriodsToDate
      - Range
    dataset: datecustom
    key_columns:
      - rpt_week
    name_column: rpt_week_name
    sort_column: rpt_week
    time_unit: week
  - unique_name: customyear
