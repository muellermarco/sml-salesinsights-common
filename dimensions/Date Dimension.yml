unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: Date Dimension that includes Gregorian, ISO8601 and Retail 445 calendars
hierarchies:
  - unique_name: CustomPP445
    label: CustomPP445
    description: >-
      A 445 calendar with custom parallel period keys defined for each level. 
      The underlying data matches the results of the Retail445 hierarchy because
      the data table contains the standard key assignments generated by the
      default ParallelPeriod logic.  A real custom ParallelPeriod hierarchy
      would have different parallel period key assignments to satisfy the rpt
      business's rpt comparison requirements.
    filter_empty: 'yes'
    folder: Date Attributes
    levels:
      - unique_name: customyear
      - unique_name: customquarter
        parallel_periods:
          - key_columns:
              - name: rpt_quarter_lykey
                data_type: datetime
            period: TimeYears
        secondary_attributes:
          - unique_name: d_Custom_Quarter_Of_Year
            label: Custom Quarter Of Year
            description: "Custom Quarter Of Year: attribute of the Custom Quarter level in the Date Dimension dimension, from datecustom.rpt_quarter_of_year_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_quarter_of_year_name
            name_column: rpt_quarter_of_year_name
            sort_column: rpt_quarter_of_year_name
      - unique_name: custommonth
        parallel_periods:
          - key_columns:
              - name: rpt_month_lykey
                data_type: datetime
            period: TimeYears
        secondary_attributes:
          - unique_name: d_Custom_Month_Name
            label: Custom Month Name
            description: "Custom Month Name: attribute of the Custom Month level in the Date Dimension dimension, from datecustom.rpt_month_name2."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_month_name2
            name_column: rpt_month_name2
            sort_column: rpt_month_name2
          - unique_name: d_Custom_Month_Of_Quarter
            label: Custom Month Of Quarter
            description: "Custom Month Of Quarter: attribute of the Custom Month level in the Date Dimension dimension, from datecustom.rpt_month_of_quarter_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_month_of_quarter_name
            name_column: rpt_month_of_quarter_name
            sort_column: rpt_month_of_quarter_name
          - unique_name: d_Custom_Month_Of_Year
            label: Custom Month Of Year
            description: "Custom Month Of Year: attribute of the Custom Month level in the Date Dimension dimension, from datecustom.rpt_month_of_year_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_month_of_year_name
            name_column: rpt_month_of_year_name
            sort_column: rpt_month_of_year_name
      - unique_name: customweek
        parallel_periods:
          - key_columns:
              - name: rpt_week_lykey
                data_type: datetime
            period: TimeYears
        secondary_attributes:
          - unique_name: d_Custom_Week_Of_Month
            label: Custom Week Of Month
            description: "Custom Week Of Month: attribute of the Custom Week level in the Date Dimension dimension, from datecustom.rpt_week_of_month_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_week_of_month_name
            name_column: rpt_week_of_month_name
            sort_column: rpt_week_of_month_name
          - unique_name: d_Custom_Week_Of_Year
            label: Custom Week Of Year
            description: "Custom Week Of Year: attribute of the Custom Week level in the Date Dimension dimension, from datecustom.rpt_week_of_year_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_week_of_year_name
            name_column: rpt_week_of_year_name
            sort_column: rpt_week_of_year_name
      - unique_name: customday
        parallel_periods:
          - key_columns:
              - name: rpt_day_lykey
                data_type: datetime
            period: TimeYears
        secondary_attributes:
          - unique_name: d_Custom_Day_Of_Month
            label: Custom Day Of Month
            description: "Custom Day Of Month: attribute of the Custom Day level in the Date Dimension dimension, from datecustom.rpt_day_of_month_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_day_of_month_name
            name_column: rpt_day_of_month_name
            sort_column: rpt_day_of_month_name
          - unique_name: d_Custom_Day_Of_Week
            label: Custom Day Of Week
            description: "Custom Day Of Week: attribute of the Custom Day level in the Date Dimension dimension, from datecustom.rpt_day_of_week_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_day_of_week_name
            name_column: rpt_day_of_week_name
            sort_column: rpt_day_of_week_name
          - unique_name: d_Custom_Day_Of_Year
            label: Custom Day Of Year
            description: "Custom Day Of Year: attribute of the Custom Day level in the Date Dimension dimension, from datecustom.rpt_day_of_year_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_day_of_year_name
            name_column: rpt_day_of_year_name
            sort_column: rpt_day_of_year_name
  - unique_name: Date Month Hierarchy
    label: Date Month Hierarchy
    description: A Gregorian Date Hierarchy.  Organizes time by Year, Quarter, Month, Day.
    filter_empty: 'yes'
    folder: Date Attributes
    levels:
      - unique_name: YearMonth
        secondary_attributes:
          - unique_name: d_quarter_number
            label: Quarter Number
            description: "Quarter Number: attribute of the Year level in the Date Dimension dimension, from datecustom.quarter_of_year."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - quarter_of_year
            name_column: quarter_of_year
            sort_column: quarter_of_year
          - unique_name: year
            label: Year
            description: "Year: attribute of the Year level in the Date Dimension dimension, from datecustom.year_name."
            contains_unique_names: false
            dataset: datecustom
            is_unique_key: false
            key_columns:
              - year
            name_column: year_name
      - unique_name: Month1
        secondary_attributes:
          - unique_name: d_month_of_year
            label: Month Of Year
            description: "Month Of Year: attribute of the Month level in the Date Dimension dimension, from datecustom.month_of_year."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - month_of_year
            name_column: month_of_year
            sort_column: month_of_year
      - unique_name: DayMonth
        secondary_attributes:
          - unique_name: d_day_of_month
            label: Day Of Month
            description: "Day Of Month: attribute of the Day level in the Date Dimension dimension, from datecustom.day_of_month."
            associated_hierarchy: Date Month Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - day_of_month
            name_column: day_of_month
            sort_column: day_of_month
          - unique_name: d_day_of_week_name
            label: Day Of Week Name
            description: "Day Of Week Name: attribute of the Day level in the Date Dimension dimension, from datecustom.day_of_week_name."
            associated_hierarchy: Date Month Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - day_of_week_name
            name_column: day_of_week_name
            sort_column: day_of_week_name
          - unique_name: d_day_of_week_number
            label: Day Of Week Number
            description: "Day Of Week Number: attribute of the Day level in the Date Dimension dimension, from datecustom.day_of_week."
            associated_hierarchy: Date Month Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - day_of_week
            name_column: day_of_week
            sort_column: day_of_week
          - unique_name: Day_Date
            label: Day Date
            description: "Day Date: attribute of the Day level in the Date Dimension dimension, from datecustom.pk_date."
            associated_hierarchy: Date Month Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - pk_date
            name_column: pk_date
            sort_column: pk_date
          - unique_name: W_Day_Date
            label: W Day Date
            description: "W Day Date: attribute of the Day level in the Date Dimension dimension, from datecustom.pk_date."
            associated_hierarchy: Date Week Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - pk_date
            name_column: pk_date
            sort_column: pk_date
          - unique_name: w_day_of_week_name
            label: W Day Of Week Name
            description: "W Day Of Week Name: attribute of the Day level in the Date Dimension dimension, from datecustom.day_of_week_name."
            associated_hierarchy: Date Week Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - day_of_week_name
            name_column: day_of_week_name
            sort_column: day_of_week_name
          - unique_name: w_day_of_week_number
            label: W Day Of Week Number
            description: "W Day Of Week Number: attribute of the Day level in the Date Dimension dimension, from datecustom.day_of_week."
            associated_hierarchy: Date Week Hierarchy
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - day_of_week
            name_column: day_of_week
            sort_column: day_of_week
  - unique_name: Date Week Hierarchy
    label: Date Week Hierarchy
    description: "Date Week Hierarchy hierarchy of the Date Dimension dimension: Year › Week › Day."
    filter_empty: 'yes'
    folder: Date Attributes
    levels:
      - unique_name: YearWeek
      - unique_name: Week
        secondary_attributes:
          - unique_name: d_week_of_year
            label: Week Of Year
            description: "Week Of Year: attribute of the Week level in the Date Dimension dimension, from datecustom.week_of_year."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - week_of_year
            name_column: week_of_year
            sort_column: week_of_year
      - unique_name: DayMonth
        secondary_attributes:
          - unique_name: weekday
            label: Weekday
            description: "Weekday: attribute of the Day level in the Date Dimension dimension, from datecustom.day_of_week."
            contains_unique_names: false
            dataset: datecustom
            is_unique_key: false
            key_columns:
              - day_of_week
            name_column: day_of_week
            sort_column: day_of_month
