    description: A Retail 4-4-5 calendar
    dataset: datecustom
    is_unique_key: true
    key_columns:
      - datekey
    name_column: rpt_day
    sort_column: datekey
    time_unit: day
  - unique_name: rpt_Half_Year
    label: rpt Half Year
    description: "rpt Half Year level of the Date Dimension dimension in the Retail445 hierarchy, from datecustom.rpt_half_year_name (key: rpt_half_year); time unit halfyear."
    dataset: datecustom
