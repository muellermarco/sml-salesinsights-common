    allowed_calcs_for_dma:
      - Lag
      - ParallelPeriod
      - Ancestor
      - Descendants
      - Siblings
      - PeriodsToDate
      - DatesPeriodsToDate
      - Range
    dataset: datecustom
    key_columns:
      - rpt_year
    name_column: rpt_year_name
    sort_column: rpt_year
    time_unit: year
  - unique_name: DayMonth
    label: Day
    description: Day level of standard calendar Month Hierarchy
    dataset: datecustom
    is_unique_key: true
    key_columns:
      - datekey
    name_column: date_name
    sort_column: datekey
    time_unit: day
  - unique_name: Month1
    label: Month
