unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: Date Dimension that includes Gregorian, ISO8601 and Retail 445 calendars
calculation_groups:
  - unique_name: Calculation Group Date Month
    label: Calculation Group Date Month
    description: none
    calculated_members:
      - unique_name: Current
        expression: ([Date Dimension].CurrentMember, [Measures].currentMember)
        format: general number
      - unique_name: Date Month Hierarchy Current vs Last Year
        expression: >-
          (([Date Dimension].CurrentMember, [Measures].currentMember) -
          (ParallelPeriod([Date Dimension].TimeYear, 1, [Date
          Dimension].CurrentMember), [Measures].currentMember ))
        format: fixed
      - unique_name: Date Month Hierarchy Current vs Last Year Pct
        expression: >-
          (([Date Dimension].CurrentMember, [Measures].currentMember) - 
          (ParallelPeriod([Date Dimension].TimeYear, 1, [Date
          Dimension].CurrentMember), [Measures].currentMember )) /
          (ParallelPeriod([Date Dimension].TimeYear, 1, [Date
          Dimension].CurrentMember), [Measures].currentMember)
        format: percent
      - unique_name: Date Month Hierarchy Month Moving Average 3 Month
        expression: >-
          Avg(ParallelPeriod([Date Dimension].TimeMonth, 2, [Date
          Dimension].CurrentMember):[Date Dimension].CurrentMember,
          [Measures].currentMember)
        format: standard
      - unique_name: Date Month Hierarchy Month to Date
        expression: >-
          Aggregate(PeriodsToDate([Date Dimension].[Date Month
          Hierarchy].[Month1], [Date Dimension].[Date Month
          Hierarchy].CurrentMember),[Measures].currentMember)
        format: general number
      - unique_name: Date Month Hierarchy Moving Average 5 Period
        expression: >-
          Avg([Date Dimension].[Date Month Hierarchy].CurrentMember.Lag(4):[Date
          Dimension].[Date Month Hierarchy].CurrentMember,
          [Measures].currentMember)
        format: scientific
      - unique_name: Date Month Hierarchy Pct of Parent
        expression: >-
          ([Date Dimension].[Date Month Hierarchy].CurrentMember,
          [Measures].currentMember) / ([Date Dimension].[Date Month
          Hierarchy].CurrentMember.parent, [Measures].currentMember)
        format: percent
      - unique_name: Date Month Hierarchy Pct of Total
        expression: >-
          ([Date Dimension].[Date Month Hierarchy].CurrentMember,
          [Measures].currentMember) / ([Date Dimension].[Date Month
          Hierarchy].[All], [Measures].currentMember)
        format: percent
    folder: Calculated Groups
hierarchies:
  - unique_name: CustomPP445
    label: CustomPP445
    description: >-
      A 445 calendar with custom parallel period keys defined for each level. 
      The underlying data matches the results of the Retail445 hierarchy because
      the data table contains the standard key assignments generated by the
      default ParallelPeriod logic.  A real custom ParallelPeriod hierarchy
      would have different parallel period key assignments to satisfy the
      reporting business's reporting comparison requirements.
    filter_empty: 'yes'
    folder: Date Attributes
    levels:
      - unique_name: customyear
      - unique_name: customquarter
        parallel_periods:
          - key_columns:
              - rpt_quarter_lykey
            level: customyear
        secondary_attributes:
          - unique_name: d_Custom_Quarter_Of_Year
            label: Custom Quarter Of Year
            description: "Custom Quarter Of Year: attribute of the Custom Quarter level in the Date Dimension dimension, from datecustom.rpt_quarter_of_year_name."
            dataset: datecustom
            folder: Date Attributes
            key_columns:
              - rpt_quarter_of_year_name
            name_column: rpt_quarter_of_year_name
            sort_column: rpt_quarter_of_year_name
      - unique_name: custommonth
